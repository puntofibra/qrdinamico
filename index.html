<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QR Dinámicos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>QR Dinámicos</title>
<style>
:root{
  --bg:#f3f4fa;--card:#ffffff;--card2:#f8f9fd;--ink:#12141c;--mut:#667085;--line:#e3e6ef;
  --acc:#4f46e5;--acc2:#9333ea;--onacc:#ffffff;--accsoft:#eef0ff;
  --grad:linear-gradient(135deg,var(--acc),var(--acc2));
  --ok:#12a150;--warn:#c27803;--bad:#d92d20;
  --okbg:#e7f6ee;--warnbg:#fff4de;--badbg:#fdeceb;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07);
  --shadow2:0 2px 4px rgba(16,24,40,.06),0 20px 44px rgba(16,24,40,.14);
  --r:18px;--glass:rgba(255,255,255,.72);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0d14;--card:#151824;--card2:#1b1f2d;--ink:#eef0f6;--mut:#98a1b3;--line:#262b3b;
    --acc:#818cf8;--acc2:#c084fc;--onacc:#0b0d14;--accsoft:#20244a;
    --ok:#3ddc84;--warn:#f5b84a;--bad:#ff7b72;
    --okbg:#12301f;--warnbg:#38290d;--badbg:#3a1714;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --shadow2:0 2px 4px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.45);
    --glass:rgba(21,24,36,.72);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.mut{color:var(--mut)}
.hide{display:none!important}
.ic{display:block;flex:0 0 auto}

/* fondo animado */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.28;animation:float 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:#6366f1;left:-160px;top:-180px}
.blobs i:nth-child(2){background:#c026d3;right:-200px;top:20%;animation-delay:-6s;opacity:.18}
.blobs i:nth-child(3){background:#06b6d4;left:20%;bottom:-260px;animation-delay:-12s;opacity:.16}
@keyframes float{to{transform:translate(80px,60px) scale(1.15)}}

/* botones */
.btn{appearance:none;border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:650;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;transition:transform .08s,background .15s,box-shadow .2s,border-color .15s;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{background:var(--accsoft);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.pri:hover{box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent)}
.btn.pri:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.pri:hover:after{left:130%}
.btn.bad{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accsoft)}
.btn.sm{padding:6px 11px;min-height:36px;font-size:13px;border-radius:10px}
.btn.icon{padding:0;width:42px}
.btn.sm.icon{width:36px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.big{min-height:52px;padding:12px 22px;font-size:15.5px;border-radius:15px}

/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1fr;place-items:center;padding:24px;gap:28px}
.hero-art{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:460px}
.hero-art .qrs{position:relative;width:210px;height:210px;margin-bottom:18px}
.hero-art .qrs>div{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.85) rotate(-6deg);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.3,1.3)}
.hero-art .qrs>div.on{opacity:1;transform:none}
.hero-art .qrs svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(40,30,120,.25))}
.hero-art h1{font-size:2rem;letter-spacing:-.02em}
.hero-art h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-art p{color:var(--mut);margin:8px 0 0}
.feats{display:none;gap:10px;margin-top:20px;text-align:left}
.feats div{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.feats span{width:34px;height:34px;border-radius:10px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center}
.lbox{width:100%;max-width:400px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:var(--shadow2);animation:pop .5s both}
.lbox h2{font-size:1.35rem}
.lbox p.sub{margin:4px 0 16px;color:var(--mut)}
label.f{display:block;font-size:13px;font-weight:650;margin:12px 0 5px;color:var(--mut)}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;min-height:44px;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.inp.badf{border-color:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 15%,transparent)}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}

/* app */
header.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:10px}
.top .tt{font-weight:800;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.top .who{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .sp{flex:1}
main{max-width:1280px;margin:0 auto;overflow-x:hidden;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.fade{animation:up .45s both}

/* cliente */
.welcome{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.welcome h1{font-size:1.6rem;letter-spacing:-.02em}
.welcome p{margin:4px 0 0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-width:0}
.stat .i{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.stat:nth-child(2) .i{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
.stat:nth-child(3) .i{background:linear-gradient(135deg,#f59e0b,#f97316)}
.stat b{display:block;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat>div>span{display:block;color:var(--mut);font-size:12.5px}
.stat>div{min-width:0}
.cgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.cgrid>*,.qgrid>*,.cls>*{min-width:0}
.plan .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ring{display:flex;align-items:center;gap:16px;margin:12px 0}
.ring svg{width:92px;height:92px;flex:0 0 92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring.warn .pr{stroke:var(--warn)} .ring.bad .pr{stroke:var(--bad)}
.ring b{font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.ring.ok b{color:var(--ok)} .ring.warn b{color:var(--warn)} .ring.bad b{color:var(--bad)}
.plan .row2{display:flex;justify-content:space-between;gap:10px;margin:4px 0 14px;color:var(--mut);font-size:13.5px;flex-wrap:wrap}
.plan .btn{width:100%}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}
.banner{padding:12px 14px;border-radius:14px;font-size:14px;margin-bottom:14px;background:var(--badbg);color:var(--bad);font-weight:600}
.banner.w{background:var(--warnbg);color:var(--warn)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shead h2{font-size:1.15rem}
.qgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.q{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;animation:up .45s both}
.q:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--acc) 30%,var(--line))}
.q .thumb{flex:0 0 96px;width:96px;height:96px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;padding:6px;transition:transform .2s}
.q .thumb:hover{transform:scale(1.04) rotate(-1deg)}
.q .thumb svg{width:100%;height:100%}
.q.off .thumb{filter:grayscale(1);opacity:.6}
.q .bd{min-width:0;flex:1;display:flex;flex-direction:column}
.q h3{font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .tp{display:flex;align-items:center;gap:6px;color:var(--acc);font-size:12px;font-weight:700;margin-bottom:3px}
.q .dest{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 10px}
.q .acts{display:flex;gap:6px;flex:1 1 100%;border-top:1px solid var(--line);padding-top:12px}
.q .acts .btn{flex:1 1 0;padding-left:6px;padding-right:6px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accsoft);color:var(--acc)}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.warn{background:var(--warnbg);color:var(--warn)} .tag.bad{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;padding:44px 16px;color:var(--mut);border:2px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty .art{width:84px;height:84px;margin:0 auto 12px;border-radius:24px;background:var(--grad);display:grid;place-items:center;color:#fff;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}

/* admin */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--mut);font-size:13px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools .inp{flex:1;min-width:180px}
.cl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;animation:up .45s both}
.cl .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cl h3{font-size:16px}
.cl .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13.5px}
.cl .meta b{color:var(--ink)}
.cl .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.cls{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,10,20,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:upbig .28s cubic-bezier(.2,.9,.3,1.1);border:1px solid var(--line)}
.sheet h2{font-size:1.2rem;margin-bottom:12px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .row .btn{flex:1 1 120px}
.qrbox{background:#fff;border-radius:18px;padding:14px;margin:0 auto;width:100%;max-width:320px;border:1px solid var(--line);position:relative;overflow:hidden}
.qrbox canvas{display:block;width:100%;height:auto}
.link{margin:12px 0 4px;padding:9px 11px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--acc);flex:0 0 18px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stat3 div{background:var(--bg);border-radius:14px;padding:12px;text-align:center}
.stat3 b{display:block;font-size:1.6rem}
.stat3 span{font-size:12px;color:var(--mut)}
.devs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.steps{padding-left:20px;margin:8px 0}
.steps li{margin:6px 0}

/* ───────── ESTUDIO (asistente) ───────── */
#studio{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:studioIn .35s cubic-bezier(.2,.9,.3,1.05)}
@keyframes studioIn{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}
.sh{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);flex:0 0 auto}
.sh .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.sh h2{font-size:1rem;white-space:nowrap}
.stepper{flex:1;display:flex;justify-content:center;align-items:center;gap:6px}
.stp{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:4px;color:var(--mut);font-weight:650;font-size:13.5px}
.stp:disabled{cursor:default}
.stp .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mut);font-weight:800;transition:background .3s,color .3s,transform .3s}
.stp.on{color:var(--ink)}
.stp.on .n{background:var(--grad);color:#fff;transform:scale(1.08);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.stp.done .n{background:var(--ok);color:#fff}
.stp .t{display:none}
.bar-l{width:28px;height:2px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar-l i{position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .4s}
.bar-l.on i{transform:none}
.sb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.sb .in{max-width:1280px;margin:0 auto;padding:18px 16px 30px}
.sf{border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
.sf .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.sf .sp{flex:1}
.slideL{animation:slideL .35s cubic-bezier(.2,.9,.3,1)}
.slideR{animation:slideR .35s cubic-bezier(.2,.9,.3,1)}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}

/* paso 1 */
.s1h{text-align:center;margin:6px 0 18px}
.s1h h1{font-size:1.6rem;letter-spacing:-.02em}
.s1h h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.s1h p{color:var(--mut);margin:6px 0 0}
.srch{max-width:520px;margin:0 auto 14px;position:relative}
.srch .ic{position:absolute;left:13px;top:12px;color:var(--mut)}
.srch .inp{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;justify-content:flex-start}
.chips.c{justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:650;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tcat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 2px 10px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tcard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .2s;animation:up .4s both;width:100%}
.tcard:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:var(--shadow2)}
.tcard.on{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.tcard .ti{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:grid;place-items:center;background:var(--accsoft);color:var(--acc);transition:transform .25s,background .25s,color .25s}
.tcard:hover .ti{transform:rotate(-8deg) scale(1.06);background:var(--grad);color:#fff}
.tcard b{display:block;font-size:15px}
.tcard span{display:block;color:var(--mut);font-size:13px}
.tcard .ar{margin-left:auto;color:var(--mut)}
.tcard .tb{flex:1;min-width:0}

/* pasos 2 y 3 */
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.fcard+.fcard{margin-top:14px}
.fhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.fhead .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--grad);color:#fff}
.fhead b{font-size:16px}
.fhead span{display:block;color:var(--mut);font-size:13px}
.fhint{font-size:12.5px;color:var(--mut);margin-top:5px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}
.fgrid .full{grid-column:1/-1}
.litem{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:4px 12px 12px;margin-top:10px;position:relative;animation:up .3s both}
.litem .rm{position:absolute;right:8px;top:8px}
.litem label.f{margin-top:8px}
.addb{margin-top:10px;width:100%;border-style:dashed}
.colrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colrow input[type=color]{width:46px;height:42px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--card);cursor:pointer}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.15)}
.imgrow{display:flex;gap:8px}
.imgrow .inp{flex:1;min-width:0}
.imgprev{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid var(--line);flex:0 0 44px;background:var(--card2)}

/* teléfono */
.pvcol{position:sticky;top:0;display:none}
.phone{width:310px;height:630px;margin:0 auto;border-radius:46px;background:#0b0d14;padding:12px;box-shadow:var(--shadow2),inset 0 0 0 2px #2a2f40;position:relative}
.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:90px;height:24px;border-radius:14px;background:#0b0d14;z-index:3}
.phone .scr{width:100%;height:100%;border-radius:36px;overflow:auto;background:#f3f4f8;scrollbar-width:none;position:relative}
.phone .scr::-webkit-scrollbar{display:none}
.phone .scr .lp{padding-top:30px}
.pvlbl{text-align:center;color:var(--mut);font-size:12.5px;margin-top:12px;display:flex;gap:6px;justify-content:center;align-items:center}

/* paso 3: diseño */
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;background:none;border:0;cursor:pointer;text-align:left}
.acc>button .ti{width:40px;height:40px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:0 0 40px}
.acc>button b{display:block;font-size:15px}
.acc>button span{display:block;color:var(--mut);font-size:12.5px}
.acc>button .ch{margin-left:auto;color:var(--acc);transition:transform .25s}
.acc.open>button .ch{transform:rotate(90deg)}
.acc .ab{display:none;padding:0 16px 16px}
.acc.open .ab{display:block;animation:up .3s both}
.opts{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.opts.wrap{flex-wrap:wrap;overflow:visible}
.opt{flex:0 0 auto;width:96px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt svg{width:100%;height:76px}
.opt small{font-size:11.5px;font-weight:650;color:#475467}
.opt:hover{transform:translateY(-2px)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.opt.sq{width:78px}
.opt.sq svg{height:58px}
.opt.lg{width:72px;height:72px;padding:0;display:grid;place-items:center;color:#344054}
.opt.lg svg{width:26px;height:26px}
.opt.lg img{width:44px;height:44px;object-fit:contain;border-radius:8px}
.cgrp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);color:var(--warn);border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:600;margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:650;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qprev{background:repeating-conic-gradient(var(--card2) 0 25%,var(--card) 0 50%) 0 0/20px 20px;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.qprev .cv{display:grid;place-items:center;min-height:260px}
.qprev canvas{max-width:100%;max-height:420px;width:auto;height:auto;display:block;transition:transform .25s}
.qprev canvas.pop{animation:popq .35s}
@keyframes popq{40%{transform:scale(.96)}}
.scanl{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent);box-shadow:0 0 16px var(--acc);top:10%;animation:scan 2.6s ease-in-out infinite;opacity:.7;pointer-events:none}
@keyframes scan{50%{top:88%}}
.mobpv{display:block;position:sticky;top:-18px;z-index:5;margin:-18px -16px 14px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 8px 20px rgba(16,24,40,.06)}
.mobpv canvas{display:block;margin:0 auto;height:150px;width:auto;max-width:100%}
.sumq{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px;color:var(--mut);font-size:13px;flex-wrap:wrap}

@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes upbig{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#14161f;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;z-index:90;background:rgba(10,12,20,.25);display:none;place-items:center}
#busy.on{display:grid}
#busy i{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ORDENADOR: horizontal */
@media (min-width:640px){
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stp .t{display:inline}
}
@media (min-width:900px){
  #login{grid-template-columns:1fr 1fr;max-width:1100px;margin:0 auto}
  .hero-art{align-items:flex-start;text-align:left}
  .hero-art .qrs{width:260px;height:260px}
  .hero-art h1{font-size:2.6rem}
  .feats{display:grid}
  main{padding:26px 24px 48px}
  .top .in,.sh .in,.sf .in{padding-left:24px;padding-right:24px}
  .sb .in{padding:26px 24px 40px}
  .cgrid{grid-template-columns:330px minmax(0,1fr);align-items:start}
  .plan{position:sticky;top:84px}
  .qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .cls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal{align-items:center}
  .sheet{border-radius:24px;padding:24px}
  .tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr) 360px}
  .pvcol{display:block;top:0}
  .mobpv,.pvbtn{display:none!important}
  .stats{gap:14px}
}
@media (min-width:1280px){
  .qgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cls{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr) 420px}
}
/* MÓVIL: vertical */
@media (max-width:899px){
  .top .who{display:none}
  .top .btn .tx{display:none}
  .top .btn.sm{width:36px;padding:0}
  .sh h2{display:none}
  .stats .stat{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
  .stat .i{width:34px;height:34px;flex-basis:34px;border-radius:11px}
  .stat b{font-size:1.25rem}
}
@media (max-width:420px){
  .q .thumb{flex-basis:84px;width:84px;height:84px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<div id="login" class="hide">
  <div class="hero-art">
    <div class="qrs" id="heroqrs"></div>
    <h1>Códigos QR <em>dinámicos</em><br>que nunca caducan</h1>
    <p>Crea, diseña y cambia el destino de tus QR cuando quieras, sin volver a imprimirlos.</p>
    <div class="feats" id="feats"></div>
  </div>
  <form class="lbox" id="lf" autocomplete="on">
    <h2>Entra en tu cuenta</h2>
    <p class="sub">Usa el usuario y la contraseña que te dimos</p>
    <label class="f" for="lu">Usuario</label>
    <input class="inp" id="lu" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="f" for="lp">Contraseña</label>
    <input class="inp" id="lp" name="password" type="password" autocomplete="current-password">
    <div class="err" id="le"></div>
    <button class="btn pri big" style="width:100%;margin-top:4px" id="lb">Entrar</button>
    <button type="button" class="btn" style="width:100%;margin-top:10px" data-act="install" id="linst">Instalar app</button>
  </form>
</div>

<div id="app" class="hide">
  <header class="top"><div class="in">
    <img src="icon-192.png" alt="">
    <span class="tt">QR Dinámicos</span>
    <span class="who" id="who"></span>
    <span class="sp"></span>
    <button class="btn sm hide" data-act="install" id="hinst" title="Instalar"><span class="ii" data-i="install"></span><span class="tx">Instalar</span></button>
    <button class="btn sm" data-act="shareapp" title="Compartir app"><span class="ii" data-i="share"></span><span class="tx">Compartir app</span></button>
    <button class="btn sm" data-act="settings" title="Ajustes"><span class="ii" data-i="gear"></span><span class="tx">Ajustes</span></button>
  </div></header>
  <main id="main"></main>
</div>

<div id="studio" class="hide">
  <div class="sh"><div class="in">
    <button class="btn icon ghost" data-st="close" title="Cerrar"><span class="ii" data-i="x"></span></button>
    <h2 id="sttl">Nuevo QR</h2>
    <div class="stepper" id="stepper"></div>
    <span style="width:42px"></span>
  </div></div>
  <div class="sb" id="sb"><div class="in" id="sbin"></div></div>
  <div class="sf"><div class="in">
    <button class="btn" data-st="back" id="stback"><span class="ii" data-i="back"></span>Atrás</button>
    <span class="sp"></span>
    <button class="btn icon pvbtn" data-st="preview" id="stpv" title="Vista previa"><span class="ii" data-i="qr"></span></button>
    <button class="btn pri" data-st="next" id="stnext">Siguiente<span class="ii" data-i="next"></span></button>
  </div></div>
</div>

<div id="toast"></div>
<div id="busy"><i></i></div>
<canvas id="confetti"></canvas>

<script src="config.js"></script>
<script src="qr.js"></script>
<script src="qrstyle.js"></script>
<script src="landing.js"></script>
<script src="app.js"></script>
</body>
</html>
