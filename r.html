<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4f46e5">
<title>Cargando…</title>
<style>
  :root{--bg:#f4f5f9;--ink:#14161f;--mut:#667085;--acc:#4f46e5;--card:#fff;--line:#e4e7ee}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0f16;--ink:#eef0f6;--mut:#98a1b3;--acc:#818cf8;--card:#171a24;--line:#272b39}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wait{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  .box{max-width:360px;animation:in .4s both}
  .sp{width:46px;height:46px;margin:0 auto 14px;position:relative}
  .sp i{position:absolute;width:18px;height:18px;border:4px solid var(--acc);border-radius:5px;animation:pulse 1s infinite}
  .sp i:nth-child(1){left:0;top:0}.sp i:nth-child(2){right:0;top:0;animation-delay:.15s}.sp i:nth-child(3){left:0;bottom:0;animation-delay:.3s}
  .sp b{position:absolute;right:3px;bottom:3px;width:12px;height:12px;background:var(--acc);border-radius:3px;animation:pulse 1s .45s infinite}
  @keyframes pulse{50%{transform:scale(.7);opacity:.4}}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-size:1.25rem;margin:0 0 6px}
  p{margin:0;color:var(--mut)}
  .ico{width:78px;height:78px;margin:0 auto 16px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4f46e5,#9333ea);box-shadow:0 14px 30px rgba(79,70,229,.35);animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
  .box.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 26px;box-shadow:0 20px 50px rgba(16,24,40,.12);max-width:380px}
  .rb{margin-top:18px;border:0;border-radius:12px;padding:12px 22px;font:700 15px system-ui;color:#fff;background:linear-gradient(135deg,#4f46e5,#9333ea);cursor:pointer}
  .brand{margin-top:18px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wait" id="wait"><div class="box" id="box"><div class="sp"><i></i><i></i><i></i><b></b></div><p>Un momento…</p></div></div>
<div id="page"></div>
<script src="config.js"></script>
<script>
(function () {
  var box = document.getElementById('box');
  var IC = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    pause: '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/>'
  };
  var MSG = {
    noexiste: ['search', 'Este código QR no existe', 'Puede que su propietario lo haya eliminado.'],
    pausado:  ['pause', 'Enlace pausado temporalmente', 'Su propietario lo ha desactivado por ahora. Vuelve a intentarlo más tarde.'],
    vencido:  ['pause', 'Enlace pausado temporalmente', 'Este código QR volverá a funcionar en cuanto su propietario lo reactive.'],
    bloqueado:['lock', 'Enlace no disponible', 'Este código QR no está disponible en este momento.'],
    error:    ['wifi', 'No se pudo cargar', 'Comprueba tu conexión e inténtalo de nuevo.', 1]
  };
  function show(k) {
    var m = MSG[k] || MSG.error;
    box.innerHTML = '<div class="ico"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[m[0]] + '</svg></div><h1>' + m[1] + '</h1><p>' + m[2] + '</p>' +
      (m[3] ? '<button class="rb" onclick="location.reload()">Reintentar</button>' : '');
    box.classList.add('card');
    document.title = m[1];
  }
  var q = (new URLSearchParams(location.search).get('q') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  var api = (window.CFG && window.CFG.API) || '';
  if (!q || !/^https:\/\//.test(api)) return show(q ? 'error' : 'noexiste');

  var ua = navigator.userAgent || '';
  var dev = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : /Android/i.test(ua) ? 'android' : /Windows/i.test(ua) ? 'windows' : /Mac/i.test(ua) ? 'mac' : /Linux/i.test(ua) ? 'linux' : 'otro';

  function load(src) {
    return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  function landing(r) {
    var d = r.datos || {};
    if (r.tipo === 'apps') {
      var to = dev === 'ios' ? d.ios : dev === 'android' ? d.android : d.web;
      if (to && /^https:\/\//i.test(to)) { location.replace(to); return; }
    }
    load('qrstyle.js?v=3').then(function () { return load('landing.js?v=3'); }).then(function () {
      Landing.injectCss();
      var pg = document.getElementById('page');
      pg.innerHTML = Landing.render(r.tipo, d);
      Landing.bind(pg, r.tipo, d);
      document.getElementById('wait').remove();
      var c = /^#[0-9a-f]{3,6}$/i.test(d.color || '') ? d.color : '#4f46e5';
      document.querySelector('meta[name=theme-color]').content = c;
      document.title = (Landing.summary(r.tipo, d) || 'QR').split(' · ')[0];
    }).catch(function () { show('error'); });
  }

  var done = false;
  window.__qrcb = function (r) {
    done = true;
    if (r && r.ok && r.tipo && r.tipo !== 'url' && !r.url) landing(r);
    else if (r && r.ok && r.url) location.replace(r.url);
    else show(r && r.reason);
  };
  var s = document.createElement('script');
  s.src = api + (api.indexOf('?') < 0 ? '?' : '&') + 'action=go&qid=' + encodeURIComponent(q) + '&device=' + dev + '&callback=__qrcb';
  s.onerror = function () { if (!done) show('error'); };
  document.head.appendChild(s);
  setTimeout(function () { if (!done) show('error'); }, 15000);
})();
</script>
</body>
</html>
